green_light_detector:
  ros__parameters:
    image_topic: /camera_node/image_raw
    camera_info_topic: /camera_node/camera_info
    input_queue_depth: 1
    use_camera_info: true
    max_track_gap_s: 0.2
    debug_image: true
    diagnostic_period_s: 1.0

    # OpenCV hue uses [0, 179]. Tune these values under the final exposure.
    threshold:
      hue_min: 35
      hue_max: 95
      saturation_min: 70
      value_min: 100
    filter:
      min_area_px: 40.0
      max_area_px: 1000000.0
      min_radius_px: 3.0
      max_radius_px: 1000.0
      min_circularity: 0.65
      min_fill_ratio: 0.45
      max_aspect_ratio: 1.35
    morphology:
      kernel: 5
      open_iterations: 1
      close_iterations: 2

    # Fallback copied from ros_sp/config/camera_info_standard3.yaml for
    # camera KE0210080605. Live CameraInfo takes priority.
    fallback_intrinsics:
      width: 1280
      height: 1024
      fx: 1785.4881526822305
      fy: 1785.026019470562
      cx: 672.4806478241826
      cy: 559.8960322479431
